<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="640" viewBox="0 0 1440 640" role="img" aria-labelledby="title desc">
  <title id="title">Watch the Mindcraft demo</title>
  <desc id="desc">Mindcraft is a cognitive remediation game using hand tracking and EEG.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#101b35"/>
      <stop offset="1" stop-color="#253b70"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#071127" flood-opacity=".35"/>
    </filter>
  </defs>
  <rect width="1440" height="640" rx="36" fill="url(#background)"/>
  <circle cx="1275" cy="110" r="260" fill="#7c9cff" opacity=".10"/>
  <circle cx="1180" cy="590" r="330" fill="#6ce0c1" opacity=".08"/>
  <g transform="translate(96 104)">
    <text x="0" y="38" fill="#8fb0ff" font-family="Arial, Helvetica, sans-serif" font-size="27" font-weight="700" letter-spacing="5">PROJECT DEMO</text>
    <text x="0" y="158" fill="#ffffff" font-family="Arial, Helvetica, sans-serif" font-size="92" font-weight="800" letter-spacing="1">MINDCRAFT</text>
    <text x="2" y="225" fill="#dbe5ff" font-family="Arial, Helvetica, sans-serif" font-size="35">Cognitive remediation through hand tracking &amp; EEG</text>
    <g transform="translate(0 292)">
      <rect width="330" height="92" rx="46" fill="#ffffff" filter="url(#shadow)"/>
      <circle cx="55" cy="46" r="29" fill="#ff3040"/>
      <path d="M48 31 L48 61 L69 46 Z" fill="#ffffff"/>
      <text x="105" y="58" fill="#101b35" font-family="Arial, Helvetica, sans-serif" font-size="31" font-weight="700">Watch demo</text>
    </g>
  </g>
  <g transform="translate(1110 228)" filter="url(#shadow)">
    <circle cx="110" cy="110" r="108" fill="#ffffff" opacity=".96"/>
    <path d="M86 61 L86 159 L157 110 Z" fill="#ff3040"/>
  </g>
</svg>
